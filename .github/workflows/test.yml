name: Tests

on:
  push:
    branches: ['*']
  pull_request:
    branches: [main]

jobs:
  c-tests:
    name: C Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential

      - name: Configure
        run: mkdir build-tests && cd build-tests && cmake ../tests

      - name: Build
        run: cd build-tests && make -j$(nproc)

      - name: Test
        run: cd build-tests && ctest -R "test_(intarray|expression|state|constraint|model|branching|solver|searchlib|integration)" --output-on-failure

  c-tests-asan:
    name: C Tests (AddressSanitizer)
    runs-on: ubuntu-latest
    env:
      # Leak detection disabled: preprocessing() has known leaks (tracked for Phase 2)
      ASAN_OPTIONS: detect_leaks=0:abort_on_error=1
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential

      - name: Configure with ASan
        run: mkdir build-tests-asan && cd build-tests-asan && cmake ../tests -DASAN=ON

      - name: Build
        run: cd build-tests-asan && make -j$(nproc)

      - name: Test
        run: cd build-tests-asan && ctest -R "test_(intarray|expression|state|constraint|model|branching|solver|searchlib|integration)" --output-on-failure

  python-tests:
    name: Python Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install build dependencies
        run: pip install cython numpy setuptools

      - name: Install package
        run: pip install --no-build-isolation -e .

      - name: Install test dependencies
        run: pip install pytest joblib gurobipy

      - name: Run tests
        run: pytest tests/ -v --tb=short
