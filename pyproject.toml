[build-system]
requires = ["setuptools>=45", "wheel", "Cython>=3.0", "numpy>=1.20"]
build-backend = "setuptools.build_meta"

[project]
name = "cbqs"
dynamic = ["version"]
description = "Constraint-Oriented Biased Quantum Search solver for linear constrained combinatorial optimization"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Soeren Wilkening"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Cython",
    "Programming Language :: C",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Physics",
]

[project.urls]
Repository = "https://github.com/SoerenWilkening/constraint-oriented-biased-quantum-search"
Paper = "https://arxiv.org/abs/2512.05205"

[tool.setuptools.dynamic]
version = {attr = "cbqs.__version__"}
